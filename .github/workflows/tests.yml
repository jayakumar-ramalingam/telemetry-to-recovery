name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional SDK for stubbed contract tests
        run: python -m pip install -r requirements-bedrock.txt
      - name: Run tests without model or AWS network calls
        run: python -m unittest -v test_engine.py test_ai.py test_ollama.py test_bedrock_sdk.py
